<!-- Website designed and developed by Kiara -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Wedding Schedule | Kiara & Nana</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Playfair+Display:wght@400;500;600&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">

<style>
:root{
    --soft-black:#1a1a1a;
    --cherry:#5A0F1C;
    --soft-white:#f5f5f5;
    --warm-white:#faf9f7;
}

body{
    margin:0;
    font-family:'Inter', sans-serif;
    background:var(--soft-white);
    color:var(--soft-black);
}

.monogram-banner{
    width:100%;
    text-align:center;
    padding:20px 0;
    background:var(--soft-white);
}

.monogram-banner img{
    width:90px;
    height:auto;
}

.subnav{
    margin-top:14px;
    display:flex;
    justify-content:center;
    align-items:center;
    gap:28px;
    flex-wrap:wrap;
}

.subnav a{
    font-family:'Playfair Display', serif;
    font-size:10px;
    letter-spacing:2.5px;
    text-transform:uppercase;
    text-decoration:none;
    color:var(--soft-black);
    opacity:.85;
    white-space:nowrap;
}

.subnav a::after{
    content:"";
    display:block;
    width:0;
    height:.5px;
    background:var(--cherry);
    margin:6px auto 0;
    transition:.3s;
}

.subnav a:hover{
    color:var(--cherry);
    opacity:1;
}

.subnav a:hover::after{
    width:100%;
}

.subnav a.disabled{
    pointer-events:none;
    opacity:.3;
    color:#999;
}

.timeline-section{
    background:var(--warm-white);
    padding:80px 20px;
    text-align:center;
}

.timeline-container{
    max-width:1200px;
    margin:0 auto;
}

.page-title{
    font-family:'Playfair Display', serif;
    font-size:52px;
    font-weight:500;
    color:var(--cherry);
    margin:0 0 12px;
}

.section-title{
    font-family:'Playfair Display', serif;
    font-size:34px;
    font-weight:500;
    color:var(--cherry);
    margin:0 0 18px;
}

.timeline-intro{
    font-size:18px;
    color:#666;
    max-width:700px;
    margin:0 auto 45px;
    line-height:1.8;
}

.timeline-image-wrapper{
    display:flex;
    justify-content:center;
    align-items:center;
    width:100%;
}

.timeline-image{
    display:block;
    width:100%;
    max-width:900px;
    height:auto;
    border-radius:12px;
    box-shadow:0 15px 40px rgba(0,0,0,.15);
}

footer{
    padding:25px 20px;
    text-align:center;
    font-family:'Playfair Display', serif;
    font-size:12px;
    letter-spacing:2px;
    color:#999;
    background:var(--soft-white);
}

@media(max-width:768px){
    .subnav{
        gap:18px;
        padding:0 10px;
    }

    .subnav a{
        font-size:9px;
        letter-spacing:2px;
    }

    .page-title{
        font-size:38px;
    }

    .section-title{
        font-size:28px;
    }

    .timeline-intro{
        font-size:16px;
        padding:0 15px;
    }
}
</style>
</head>

<body>

<div class="monogram-banner">
    <img src="monogram.png" alt="Monogram">

    <nav class="subnav">
        <a href="home.html">Home</a>
        <a href="our-story.html">Our Story</a>
        <a href="wedding-details.html">Details</a>
        <a href="schedule.html">Schedule</a>
        <a href="travel.html">Travel</a>
        <a href="gallery.html" class="disabled">Gallery</a>
        <a href="wedding-party-login.html">Wedding Party</a>
        <a href="rsvp.html">RSVP</a>
    </nav>
</div>

<section class="timeline-section">
    <div class="timeline-container">

        <h1 class="page-title">Wedding Details</h1>

        <h2 class="section-title">Wedding Timeline</h2>

        <p class="timeline-intro">
            We can't wait to celebrate with you. Here's what to expect throughout the evening.
        </p>

        <div class="timeline-image-wrapper">
            <img src="500PM.png"
                 alt="Kiara & Nana Wedding Timeline"
                 class="timeline-image">
        </div>

    </div>
</section>

<footer>
    YEBOAH EVER AFTER
</footer>

</body>
</html>
