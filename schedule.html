<style>

}

body{

/* Navigation */

.monogram-banner img{

.subnav{

    gap:28px;
    flex-wrap:wrap;
}

.subnav a{
    font-family:'Playfair Display',serif;
    font-size:10px;
    letter-spacing:2.5px;
    text-transform:uppercase;
    text-decoration:none;
    color:var(--soft-black);
    opacity:.85;
    transition:.3s;
}

.subnav a::after{
    content:"";
    display:block;
    width:0;
    height:.5px;
    background:var(--cherry);
    margin:6px auto 0;
    transition:.3s;
}

.subnav a:hover{
    color:var(--cherry);
}

.subnav a:hover::after{
    width:100%;
}

.subnav a.disabled{
    pointer-events:none;
    opacity:.35;
}

.timeline-section{

.timeline-image{
