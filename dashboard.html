<!DOCTYPE html>
<html>
<head>
<title>Wedding Command Center</title>

<style>
body{
    font-family: Inter, sans-serif;
    background:#f5f5f5;
    padding:20px;
}

h1{
    color:#5a0f1c;
}

.topbar{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
    margin-bottom:15px;
}

input, select, button{
    padding:10px;
    border-radius:8px;
    border:1px solid #ddd;
}

button{
    background:#5a0f1c;
    color:white;
    border:none;
    cursor:pointer;
}

button:hover{
    background:#421019;
}

.stats{
    display:flex;
    gap:10px;
    margin-bottom:15px;
    flex-wrap:wrap;
}

.stat{
    background:white;
    padding:10px 15px;
    border-radius:10px;
}

.card{
    background:white;
    padding:15px;
    margin-bottom:10px;
    border-radius:10px;
    box-shadow:0 2px 8px rgba(0,0,0,0.05);
}

.badge{
    padding:4px 8px;
    border-radius:20px;
    font-size:12px;
}

.attending{ background:#d4f8d4; }
.declined{ background:#ffd6d6; }
.pending{ background:#eee; }
</style>
</head>

<body>

<h1>Wedding Command Center</h1>

<div class="topbar">
    <input id="search" placeholder="Search guest...">

    <select id="filter" onchange="applyFilter()">
        <option value="ALL">All</option>
        <option value="Attending">Attending</option>
        <option value="Declined">Declined</option>
        <option value="Pending">No Response</option>
    </select>

    <button onclick="exportCSV()">Export CSV</button>
    <button onclick="exportFiltered()">Export Filtered</button>
</div>

<div class="stats">
    <div class="stat" id="total">Total: 0</div>
    <div class="stat" id="attending">Attending: 0</div>
    <div class="stat" id="declined">Declined: 0</div>
    <div class="stat" id="missing">No Response: 0</div>
</div>

<div id="list"></div>

<script>

const scriptURL = "https://script.google.com/macros/s/AKfycbxKPyMYRevc2dQ4HGLGUCEDBESHzZNrOdhm-QRU5lOU1a2uYSyFtbdQCFZsCLGxOzsT/exec";

let store = [];

const expectedGuests = [
"Kiara Copeman","Nana Yeboah","Ava Copeman",
"Amana Simmons","Mark Simmons",
"Adiya Ingram","Justin Bridgewater",
"Tiffany Lansdowne","Timothy Lansdowne",
"Anthony Copeman","Kelsie Copeman",
"India Walker","Joeseph Jennings",
"John Gladney","Alandria Gladney",
"Eric Ellis","Marsha Ellis",
"Kwame Amo-Awuah","Laila Smith",
"Thomas Evans","Erica Opoku",
"Andy Boone","Taylor Boone",
"Farid Adechoubou","Jamiah Harrison",
"Nana Kessie","Chrissie Chinebuah",
"Eliana Oechsler","Greg Burgess",
"Michael Lawton","Tediah Lawton",
"Stephanie Kumi",
"Adwoa Yeboah Kwapong","Reggie Kwapong",
"Raquese Harris","Vanessa Harris",
"Kevin Opoku","Larissa Akono-Opoku"
];

async function load(){

    const res = await fetch(scriptURL);
    const data = await res.json();

    store = data;

    let attending = 0;
    let declined = 0;
    let responded = new Set();

    let html = "";

    data.forEach(g => {

        if(g.status === "Attending") attending++;
        if(g.status === "Declined") declined++;
        if(g.status) responded.add(g.name);

        html += `
        <div class="card"
            data-name="${g.name}"
            data-status="${g.status || "Pending"}">

            <b>${g.name}</b><br>

            <span class="badge ${getClass(g.status)}">
                ${g.status || "Pending"}
            </span>

            <div>Follow Up: ${g.followUp || "No"}</div>
            <div>Checked In: ${g.checkedIn || "No"}</div>

            <br>

            <button onclick="edit('${g.name}')">Edit</button>
            <button onclick="follow('${g.name}')">Follow Up</button>
            <button onclick="checkin('${g.name}')">Check In</button>
        </div>
        `;
    });

    let missing = expectedGuests.filter(g => !responded.has(g));

    document.getElementById("list").innerHTML = html;

    document.getElementById("total").innerText = "Total: " + (attending + declined);
    document.getElementById("attending").innerText = "Attending: " + attending;
    document.getElementById("declined").innerText = "Declined: " + declined;
    document.getElementById("missing").innerText = "No Response: " + missing.length;
}

function getClass(s){
    if(s === "Attending") return "attending";
    if(s === "Declined") return "declined";
    return "pending";
}

document.getElementById("search").addEventListener("input", e => {
    let val = e.target.value.toLowerCase();

    document.querySelectorAll(".card").forEach(c => {
        c.style.display = c.dataset.name.toLowerCase().includes(val)
            ? "block"
            : "none";
    });
});

function applyFilter(){
    let f = document.getElementById("filter").value;

    document.querySelectorAll(".card").forEach(c => {

        let s = c.dataset.status;

        if(f === "ALL") c.style.display = "block";
        else if(f === "Pending" && (!s || s === "Pending")) c.style.display = "block";
        else if(s === f) c.style.display = "block";
        else c.style.display = "none";
    });
}

function edit(name){
    let status = prompt("Attending or Declined?");
    fetch(scriptURL + "?name=" + name + "&status=" + status)
        .then(load);
}

function follow(name){
    fetch(scriptURL + "?followup=" + name)
        .then(load);
}

function checkin(name){
    fetch(scriptURL + "?checkin=" + name)
        .then(load);
}

function exportCSV(){

    let csv = "Name,Status,FollowUp,CheckedIn\n";

    store.forEach(g => {
        csv += `${g.name},${g.status},${g.followUp},${g.checkedIn}\n`;
    });

    download(csv,"rsvp.csv");
}

function exportFiltered(){

    let csv = "Name,Status\n";

    document.querySelectorAll(".card").forEach(c => {
        if(c.style.display !== "none"){
            csv += `${c.dataset.name},${c.dataset.status}\n`;
        }
    });

    download(csv,"filtered.csv");
}

function download(data,name){
    const blob = new Blob([data],{type:"text/csv"});
    const url = URL.createObjectURL(blob);

    const a = document.createElement("a");
    a.href = url;
    a.download = name;
    a.click();
}

load();
setInterval(load,5000);

</script>

</body>
</html>
