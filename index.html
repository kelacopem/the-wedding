<!-- Website designed and developed by Kiara -->    
    <!DOCTYPE html>
    <html lang="en">
    <head>
    <meta charset="UTF-8">
    <title>YEBOAH EVER AFTER</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
</head>
  <body>
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Playfair+Display:wght@400;600&family=Inter:wght@300&display=swap" rel="stylesheet">
    
<!-- PASSWORD TO ENTER WEDDING WEBSITE-->
    <div id="password-screen">
      <div class="password-wrapper">
    
        <!-- BOX -->
        <div class="password-box">
          <h2>Welcome</h2>
          <p class="subtitle">Please enter the password to view our wedding site</p>
          
          <input type="password" id="password-input" placeholder="Enter Password">
          <button onclick="checkPassword()">Enter</button>
          
          <p id="error-message"></p>

        <div class="bride-signature">
          Created by the Bride ♡
        </div>
        </div>
        <!-- ORCHID -->
         <img src="orchid-wreath.png" class="orchid-img">  
        
      </div>
    </div>
  </body>
<style>
     :root {
      --soft-black: #1a1a1a;
      --cherry: #5a0f1c;
      --violet: #2d0f3a;
      --soft-white: #f5f5f5;
    }
        
     body {
      margin: 0;
      font-family: 'Inter', sans-serif;
      color: var(--soft-black);
      background-color: var(--soft-white);
    }

    @media (max-width: 600px) {
  .orchid-img {
    width: 380px;
    right: -80px;
    opacity: 0.6; /* optional: softer luxury feel */
  }
}
    .site-wrapper {
      max-width: 520px;
      margin: 0 auto;
    }
  @media (max-width: 600px) {

  .monogram-banner img {
    width: 70px; /* smaller logo */
  }

  .subnav {
    gap: 18px;
  }

  .subnav a {
    font-size: 10px;
    letter-spacing: 2px;
  }

  .hero-box, .login-box {
    margin: 30px auto;
    padding: 25px 20px;
  }

}
/* PASSWORD */
    #password-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: var(--soft-white);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 9999;
    }
    
    /* LAYOUT */
    @media (max-width: 600px)  {
    .password-wrapper {
      position: relative;
      display: inline-block; /* THIS is the key fix */
      transform: scale (0.95);
      transform-origin: center;
    }
   @media (max-width: 600px) {
    .password-box {
      transform: scale(0.92); /* subtle scale only */
      transform-origin: center;
      padding: 25px 20px;
      width: 260px;
      }
    }
        
    /* BOX */
    .password-box {
      background: white;
      padding: 30px 25px;   /* ⬅️ reduced padding */
      border: 1px solid rgba(0,0,0,0.1);
      width: 260px;         /* ⬅️ smaller width */
      text-align: center;
      position: relative;
      z-index: 2;
    }
    /* ORCHID */
    .orchid-img {
      position: absolute;
      right: -140px;  /* pushes orchid OUTSIDE box */
      top: 50%;
      transform: translateY(-50%);
      width: 620px;
      z-index: 1;
    }
    
    /* Names */
    .password-box h2 {
      font-family: 'Playfair Display', serif;
      font-size: 28px;
      margin-bottom: 10px;
      color: var(--soft-black);      
    }
  /* Subtitle */
    .subtitle {
      font-size: 11px;
      letter-spacing: 1.8px;
      color: #777;
      margin-bottom: 25px;
      white-space: normal;
      line-height: 1.4;
    }
    
    /* Input */
    .password-box input {
      width: 85%;
      padding: 10px;
      border: 1px solid #ddd;
      margin-bottom: 15px;
      font-family: 'Inter', sans-serif;
      font-size: 16px; /* THIS STOPS ZOOM */
    }
    
    /* Button */
    .password-box button {
      width: 100%;
      padding: 10px;
      border: 1px solid var(--cherry);
      background: none;
      color: var(--soft-black);
      cursor: pointer;
      transition: 0.3s ease;
    }
    
    /* Hover */
    .password-box button:hover {
      background: var(--cherry);
      color: white;
    }
    /* Password box sits on top */
    .password-box {
      background: white;
      padding: 50px 40px;
      border: 1px solid rgba(0,0,0,0.1);
      width: 320px;
      text-align: center;
      position: relative;
      z-index: 2;
    }   
    /* Error */
    #error-message {
      color: #b00020;
      font-size: 12px;
      margin-top: 10px;
    }
    
    #error-message {
      color: red;
      font-size: 12px;
      margin-top: 10px;
    }
    
   .bride-signature {
      text-align: center;
      margin: 15px 0 5px;

      font-family: 'Playfair Display', serif;
      font-size: 11px;          /* smaller */
      letter-spacing: 2px;

      color: #5a0f1c;
      opacity: 0.6;
}   
    </style>
    <script>
      function checkPassword() {
      const correctPassword = "NK2026";
      const userInput = document.getElementById("password-input").value;

      if (userInput === correctPassword) {
        sessionStorage.setItem("weddingAccess", "granted");
        window.location.href = "home.html";  // redirect to main site
    } else {
        document.getElementById("error-message").innerText = "Incorrect password";
    }
  }
   </script>
   <script>
    document.addEventListener("DOMContentLoaded", function() {
    document.getElementById("password-input").addEventListener("keypress", function(e) {
    if (e.key === "Enter") {
      checkPassword();
    }
  });
});
</script>
</html>
