<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<title>RSVP | Kiara & Nana</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">

<style>

body{
    font-family:'Inter',sans-serif;
    background:#f9f6f2;
    margin:0;
    padding:20px;
    color:#333;
}

.container{
    max-width:800px;
    margin:50px auto;
    background:white;
    padding:40px;
    border-radius:12px;
    box-shadow:0 4px 20px rgba(0,0,0,0.08);
}

h1{
    font-family:'Playfair Display',serif;
    text-align:center;
    color:#5a0f1c;
}

.subtitle{
    text-align:center;
    color:#666;
    margin-bottom:25px;
}

.form-group{
    margin-bottom:18px;
}

label{
    display:block;
    margin-bottom:6px;
    font-weight:500;
}

input, select, textarea{
    width:100%;
    padding:12px;
    border-radius:8px;
    border:1px solid #ddd;
    box-sizing:border-box;
}

button{
    background:#5a0f1c;
    color:white;
    border:none;
    padding:14px;
    width:100%;
    border-radius:8px;
    cursor:pointer;
}

button:hover{
    background:#421019;
}

.guest-card{
    border:1px solid #eee;
    padding:15px;
    margin-bottom:12px;
    border-radius:10px;
}

.hidden{
    display:none;
}

#success{
    text-align:center;
    color:green;
    font-weight:bold;
    margin-top:20px;
}

</style>
</head>

<body>

<div class="container">

<h1>RSVP</h1>

<p class="subtitle">
We look forward to celebrating with you!
</p>

<!-- LOGIN -->
<div class="form-group">
<label>Please enter the last 5 digits of your phone number to access RSVP. </label>
<input type="text" id="lookup" maxlength="5">
</div>

<button type="button" onclick="findGuest()">Find My Invitation</button>

<!-- RSVP FORM -->
<form id="rsvpForm" class="hidden">

<div id="guestList"></div>

<!-- HOTEL -->
<div class="form-group">
<label>Hotel Accommodations</label>

<select id="hotel">
    <option value="">Select Hotel</option>
    <option value="Holiday Inn Leesburg">Holiday Inn Leesburg</option>
    <option value="Home2 Suites Leesburg">Home2 Suites Leesburg</option>
    <option value="Hotel Burg">Hotel Burg</option>
    <option value="Lansdowne Resort">Lansdowne Resort</option>
    <option value="Other">Other</option>
    <option value="Not Staying">Not Staying at a Hotel</option>
</select>

</div>

<div class="form-group hidden" id="otherHotelSection">
<label>Please specify hotel</label>
<input type="text" id="otherHotel">
</div>

<div class="form-group hidden" id="transportSection">
<label>Will you need transportation to/from the wedding?</label>

<select id="transportation">
    <option value="">Select</option>
    <option value="Yes">Yes</option>
    <option value="No">No</option>
</select>

</div>

<!-- OPTIONAL -->

<div class="form-group">
<label>Message for the Couple</label>
<textarea id="message"></textarea>
</div>

<button type="submit">Submit RSVP</button>

</form>

<div id="success"></div>

</div>

/* =========================
   LOOKUP FUNCTION
   ========================= */

function findGuest(){

    const lookup = document.getElementById('lookup').value.trim();

    const match = guestData.find(g =>
        String(g.lookup) === String(lookup)
    );

    if(!match){
        alert("We couldn’t find your invitation. Please check your code.");
        return;
    }

    let html = "";

    match.guests.forEach(name => {

        html += `
        <div class="guest-card">

            <h3>${name}</h3>

            <label>RSVP</label>
            <select class="response" data-name="${name}">
                <option value="">Select</option>
                <option value="Attending">Joyfully Accepts</option>
                <option value="Declined">Regretfully Declines</option>
            </select>

        </div>
        `;
    });

    document.getElementById('guestList').innerHTML = html;
    document.getElementById('rsvpForm').classList.remove('hidden');
}

/* =========================
   HOTEL LOGIC
   ========================= */

document.getElementById('hotel').addEventListener('change', function(){

    const shuttleHotels = [
        "Holiday Inn Leesburg",
        "Home2 Suites Leesburg",
        "Hotel Burg",
        "Lansdowne Resort"
    ];

    document.getElementById('transportSection')
        .classList.toggle('hidden', !shuttleHotels.includes(this.value));

    document.getElementById('otherHotelSection')
        .classList.toggle('hidden', this.value !== "Other");
});

/* =========================
   SUBMIT RSVP → GOOGLE SHEETS
   ========================= */

const scriptURL = "https://script.google.com/macros/s/AKfycbwKGFrAux42lwmiOiMdSTxQxpjjICVdYMqAnVUDgIqiNxS02TYn17SaTsP7DHFnahlW/exec";

document.getElementById('rsvpForm').addEventListener('submit', function(e){

    e.preventDefault();

    const guestResponses = [];

    document.querySelectorAll('.response').forEach(r => {

        const name = r.dataset.name;

        const meal = document.querySelector(
            `.meal[data-name="${name}"]`
        );

        guestResponses.push({
            name: name,
            response: r.value,
            meal: ""
        });
    });

    const payload = {
        lookup: document.getElementById('lookup').value,
        hotel: document.getElementById('hotel').value,
        otherHotel: document.getElementById('otherHotel')?.value || "",
        transportation: document.getElementById('transportation')?.value || "",
        song: document.getElementById('song').value,
        message: document.getElementById('message').value,
        guestResponses: JSON.stringify(guestResponses)
    };

    fetch(scriptURL, {
        method: "POST",
        body: new URLSearchParams(payload)
    })
    .then(() => {

        document.getElementById('success').innerHTML =
        "Thank you! Your RSVP has been received.";

        document.getElementById('rsvpForm').reset();
    })
    .catch(() => {
        alert("There was an error submitting your RSVP.");
    });

});

</script>

</body>
</html>
