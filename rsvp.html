  <input type="text" id="lookup" maxlength="5">
</div>

<button type="button" onclick="findGuest()">Find My Invitation</button>

<form id="rsvpForm" class="hidden">

<div id="guestList"></div>

<div class="form-group">
  <label>Hotel Accommodations</label>
  <select id="hotel">
    <option value="">Select Hotel</option>

  </select>
</div>

<div class="form-group hidden" id="otherHotelSection">
  <label>Please specify hotel</label>
  <input type="text" id="otherHotel">
</div>

<div class="form-group hidden" id="transportSection">
  <label>Need transportation?</label>
  <select id="transportation">
    <option value="">Select</option>
    <option value="Yes">Yes</option>

  </select>
</div>

<div class="form-group">

</div>

<button type="submit">Submit RSVP</button>

</form>

<script>

];

function findGuest(){

    const lookup = document.getElementById('lookup').value.trim();
    const match = guestData.find(g => g.lookup === lookup);

    if(!match){
        alert("We couldn’t find your invitation code.");
        return;
    }

    let html = "";

    match.guests.forEach(name => {
        html += `
        <div class="guest-card">
            <h3>${name}</h3>

            <label>RSVP</label>
            <select class="response" data-name="${name}">
                <option value="">Select</option>
                <option value="Attending">Joyfully Accepts</option>
                <option value="Declined">Regretfully Declines</option>
            </select>
        </div>`;
    });

    document.getElementById('guestList').innerHTML = html;
    document.getElementById('rsvpForm').classList.remove('hidden');
}

document.getElementById('hotel').addEventListener('change', function(){

    const shuttleHotels = [
        "Holiday Inn Leesburg",
        "Home2 Suites Leesburg",
        "Hotel Burg",
        "Lansdowne Resort"
    ];

    document.getElementById('transportSection')
        .classList.toggle('hidden', !shuttleHotels.includes(this.value));

    document.getElementById('otherHotelSection')
        .classList.toggle('hidden', this.value !== "Other");
});

document.getElementById('rsvpForm').addEventListener('submit', function(e){

    e.preventDefault();

    const guestResponses = [];

    document.querySelectorAll('.response').forEach(r => {
        guestResponses.push({
            name: r.dataset.name,
            response: r.value
        });
    });

    const payload = {
        lookup: document.getElementById('lookup').value,
        hotel: document.getElementById('hotel').value,
        otherHotel: document.getElementById('otherHotel')?.value || "",
        transportation: document.getElementById('transportation')?.value || "",
        message: document.getElementById('message').value,
        guestResponses: JSON.stringify(guestResponses)
    };

    fetch(scriptURL, {
        method: "POST",
        body: new URLSearchParams(payload)
    })
    .then(() => {

        // THIS is the success message line
        document.getElementById('success').innerHTML =
        "Thank you! Your RSVP has been received.";

        document.getElementById('rsvpForm').reset();
    })
    .catch(() => {
        alert("There was an error submitting your RSVP.");
    });
});

</script>
