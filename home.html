    <style>
    :root {
      --soft-black: #1a1a1a;
      --cherry: #5a0f1c;
      --violet: #2d0f3a;
      --soft-white: #f5f5f5;
    }
        
     body {
      margin: 0;
      font-family: 'Inter', sans-serif;
      color: var(--soft-black);
      background-color: var(--soft-white);
    }
    
    /* HERO */
     header {
      min-height: auto;
      padding: 40px 0;
      background: linear-gradient(rgba(255,255,255,0.4), rgba(255,255,255,0.7)),
                  url('https://images.unsplash.com/photo-1529634896145-d3d4a9e5f3b4') center/cover no-repeat;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
    }
    .monogram-banner {
      width: 100%;
      text-align: center;
      padding: 20px 0;
      background-color: var(--soft-white); /* or black if you want contrast */
    }
    
    .monogram-banner img {
      width: 90px; /* adjust size */
      height: auto;
      
    }
    .subnav {
      margin-top: 14px;

      display: flex;
      justify-content: center;
      align-items: center;

      gap: 28px;              /* slightly tighter to fit 8 items */
      flex-wrap: wrap;        /* allows clean wrapping on small screens */
    }

    .subnav a {
      font-family: 'Playfair Display', serif;
      font-size: 10px;        /* slightly smaller for 8 links */
      letter-spacing: 2.5px;
      text-transform: uppercase;
      text-decoration: none;
      color: var(--soft-black);
      opacity: 0.85;
      white-space: nowrap;
      transition: all 0.3s ease;
    }

    /* Thin luxury underline */
    .subnav a::after {
      content: "";
      display: block;
      width: 0;
      height: 0.5px;
      background: var(--cherry);
      margin: 6px auto 0;
      transition: width 0.3s ease;
    }

    .subnav a:hover {
      color: var(--cherry);
      opacity: 1;
    }

    .subnav a:hover::after {
      width: 100%;
    }    
    .hero-box {
      padding: 25px;
      border: 1px solid var(--cherry);
      background: rgba(255,255,255,0.7);
      max-width: 90%;
      color: var(--soft-black);
    }
    
    .monogram {
      font-family: 'Great Vibes', cursive;
      font-size: 50px;
      color: var(--cherry);
    }
    
    h1 {
      font-family: 'Playfair Display', serif;
      font-size: 42px;
      margin: 10px 0;
    }
    
    .date {
      letter-spacing: 3px;
      color: var(--violet);
      margin-bottom:10px;
    }
    
    /* COUNTDOWN */
    #countdown {
      display: flex;
      justify-content: center;
      gap: 25px;
      margin-top: 15px;
      padding-top: 20px;
      border-top: 1px solid rgba(0,0,0,0.1);
    }
    
    .time {
      text-align: center;
      min-width:70px;
    }
    .time span {
      display: block;
      font-size: 28px;
      font-family: 'Playfair Display', serif;
      color: var(--soft-black);
    }
    
      .time small {
        font-size: 11px;
        letter-spacing: 2px;
        text-transform: uppercase;
        color: #888;
    }
    
    /* SECTIONS */
    section {
      padding: 60px 20px;
      text-align: center;
    }
    
    h2 {
      font-family: 'Playfair Display', serif;
      margin-bottom: 20px;
      color: var(--cherry);
    }
    
    /* DETAILS */
    .details-section {
      background-color: var(--soft-white);
      color: #1a1a1a;
      margin: 6px 0;
    }
    
    /* GALLERY */
    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 12px;
    }
    
    .gallery img {
      width: 100%;
      height: 250px;
      object-fit: cover;
      transition: 0.3s ease;
      filter: brightness(90%);
    }
    
    .gallery img:hover {
      transform: scale(1.03);
      filter: brightness(100%);
    }
    .video-section {
      max-width: 100%;
      text-align: center;
    }
    
    .video-section video {
      width: 100%;
      height: auto;        /* ⬅️ keeps proportions correct */
      max-height: 80vh; /* ⬅️ prevents it from getting too tall */
      object-fit: contain; /* ⬅️ ensures no cropping */
      display: block;
      margin: 0 auto;
      margin-bottom: 10px;
      pointer-events: auto;
    }
    .unmute-btn {
      position: static; /* ✅ THIS is the key change */
      margin: 15px auto 0; /* space above + center */

      display: block;

      padding: 12px 24px;
      border: 1px solid var(--cherry);
      background: rgba(255,255,255,0.85);

      font-family: 'Playfair Display', serif;
      letter-spacing: 1px;
      cursor: pointer;
      transition: 0.3s ease;
}

    .unmute-btn:hover {
      background: var(--cherry);
      color: white;
}    
   .subnav a.disabled {
      pointer-events: none;
      opacity: 0.3;
      color: #999;
      cursor: not-allowed;
}
   .subnav a.disabled:hover {
      color: #999;
}

   .subnav a.disabled::after {
      width: 0 !important;
}
   #fullscreenBtn {
      position: absolute;
      bottom: 20px;
      right: 20px;
      z-index: 10;
      background: rgba(0,0,0,0.5);
      color: white;
      border: none;
      padding: 10px 12px;
      font-size: 16px;
      cursor: pointer;
      backdrop-filter: blur(6px);
}
    /* FOOTER */
    footer {
      padding: 20px;
      font-size: 14px;
      letter-spacing: 2px;
      color: #aaa;
      text-align: center;
    }
    </style>
    </head>

    <script>
        
/* 🔐 PROTECT PAGE (runs immediately) */
if (sessionStorage.getItem("weddingAccess") !== "granted") {
  window.location.href = "password.html";
}
</script>

<script>
/* ⏳ COUNTDOWN */
const weddingDate = new Date("August 14, 2026 17:00:00").getTime();

setInterval(() => {
  const now = new Date().getTime();
  const d = weddingDate - now;

  document.getElementById("days").innerText = Math.floor(d / (1000*60*60*24));
  document.getElementById("hours").innerText = Math.floor((d/(1000*60*60))%24);
  document.getElementById("minutes").innerText = Math.floor((d/(1000*60))%60);
  document.getElementById("seconds").innerText = Math.floor((d/1000)%60);
}, 1000);
</script>

<script>
/* 🔊 VIDEO SOUND */
function toggleSound() {
  const video = document.getElementById("weddingvideo");
  const btn = document.querySelector(".unmute-btn");

  video.muted = false;
  video.play();

  btn.style.display = "none";
}
</script>

<script>
const video = document.getElementById("heroVideo");
const btn = document.getElementById("fullscreenBtn");

btn.addEventListener("click", () => {
  if (!document.fullscreenElement) {
    video.requestFullscreen();
  } else {
    document.exitFullscreen();
  }
});
</script>
<script>
video.addEventListener("click", () => {
  if (!document.fullscreenElement) {
    video.requestFullscreen();
  }
});
</script>
<script>
/* 👰🏽‍♀️ WEDDING PARTY ACCESS */
function checkPartyAccess() {
  const input = document.getElementById("party-password").value;

  if (input === "BRIDE1") {
    window.location.href = "kiara.html";
  } 
  else if (input === "BRIDE2") {
    window.location.href = "maya.html";
  } 
  else if (input === "GROOM1") {
    window.location.href = "james.html";
  } 
  else {
    document.getElementById("error").innerText = "Incorrect password";
  }
}
</script>
